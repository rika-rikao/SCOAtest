<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOA対策アプリ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .page { display: none; }
    .page.active { display: block; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .choice-btn { display: block; width: 100%; text-align: left; margin-bottom: 10px; }
    #timer { font-size: 1.5em; font-weight: bold; color: red; }
  </style>
</head>
<body>
  <h1>SCOA対策アプリ</h1>

  <div id="page-menu" class="page active">
    <h2>メニュー</h2>
    <button onclick="navigate('page-generate')">問題を生成・蓄積する (Gemini API)</button>
    <button onclick="startTest('all')">本番モード (全ジャンル・時間制限あり)</button>
    <button onclick="startTest('math')">数理のみ出題</button>
    <button onclick="startTest('language')">言語のみ出題</button>
  </div>

  <div id="page-generate" class="page">
    <h2>問題生成</h2>
    <select id="gen-genre">
      <option value="言語">言語</option>
      <option value="数理">数理</option>
      <option value="論理">論理</option>
      <option value="常識">常識</option>
      <option value="英語">英語</option>
    </select>
    <button id="btn-generate">生成してFirebaseに保存</button>
    <p id="gen-status"></p>
    <button onclick="navigate('page-menu')">戻る</button>
  </div>

  <div id="page-test" class="page">
    <div style="display: flex; justify-content: space-between;">
      <h2 id="test-progress">問題 1 / 120</h2>
      <div id="timer">60:00</div>
    </div>
    <p id="question-text" style="font-size: 1.2em;"></p>
    <div id="choices-container"></div>
  </div>

  <div id="page-result" class="page">
    <h2>テスト結果</h2>
    <p id="score-display"></p>
    <button onclick="navigate('page-menu')">メニューに戻る</button>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    // PWA Service Workerの登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Registered'));
    }
  </script>
</body>
</html>
